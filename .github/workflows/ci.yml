name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loreforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and API tests (SQLite)
        run: npm test
      - name: Server tests (Postgres)
        run: npm run test:pg
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/loreforge_test
      - name: Build client
        run: npm run build
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: End-to-end smoke test
        run: |
          PORT=3000 SQLITE_FILE=/tmp/e2e.db ADMIN_EMAILS=mod@e2e.test AUTH_RATE_LIMIT=1000 npm start > /tmp/server.log 2>&1 &
          npx --yes wait-on@8 -t 30000 http://localhost:3000/api/health
          npm run e2e
          npm run a11y
        env:
          BASE_URL: http://localhost:3000
          MOD_EMAIL: mod@e2e.test
          MAIL_LOG: /tmp/server.log
      - name: End-to-end smoke test (Postgres)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE kindred_e2e'
          PORT=3001 DATABASE_URL=postgres://postgres:postgres@localhost:5432/kindred_e2e ADMIN_EMAILS=mod@e2e.test AUTH_RATE_LIMIT=1000 npm start > /tmp/server-pg.log 2>&1 &
          npx --yes wait-on@8 -t 30000 http://localhost:3001/api/health
          npm run e2e
        env:
          BASE_URL: http://localhost:3001
          MOD_EMAIL: mod@e2e.test
          MAIL_LOG: /tmp/server-pg.log
