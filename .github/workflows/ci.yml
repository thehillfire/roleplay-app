name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loreforge_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit and API tests (SQLite)
        run: npm test
      - name: Account tests (Postgres)
        run: npm run test:pg
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/loreforge_test
      - name: Build client
        run: npm run build
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - name: End-to-end smoke test
        run: |
          PORT=3000 SQLITE_FILE=/tmp/e2e.db npm start &
          npx --yes wait-on@8 -t 30000 http://localhost:3000/api/health
          npm run e2e
        env:
          BASE_URL: http://localhost:3000
