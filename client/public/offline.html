<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0a10" />
<title>Kindred: offline</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #0b0a10; color: #f3f1f7; font-family: system-ui, -apple-system, sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; box-sizing: border-box; }
  img { width: 96px; height: 96px; }
  h1 { margin: 0; font-size: 28px; text-transform: uppercase; letter-spacing: 0.02em; transform: skewX(-9deg); text-shadow: 3px 3px 0 #ffe14d; }
  p { margin: 0; max-width: 320px; line-height: 1.55; color: #aba8ba; }
  a { display: inline-block; margin-top: 8px; padding: 14px 26px; background: #ffe14d; color: #15120a; font-weight: 700; text-decoration: none; text-transform: uppercase; letter-spacing: 0.08em; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="" />
  <h1>You're offline</h1>
  <p>Kindred needs a connection to reach the people you talk to. Your chats are safe and will be right here when you're back.</p>
  <p>If you need help right now, call or text 988 (US).</p>
  <a href="/">Try again</a>
</main>
</body>
</html>
